<html lang="en">

  <title>Planner | MealMint Health Labs</title>
  <link rel="stylesheet" href="css/mealmint-styles.css">
</head>

<body data-page="planner">
  <div class="app-shell">
    <header class="topbar">
      <div class="nav-wrap">
        <a class="brand-link" href="mealmint-index.html" aria-label="MealMint Health Labs home">
          <img class="brand-mark" src="resources/mealmint_logo.png" alt="MealMint Health Labs logo">
          <span class="brand-subtitle">Plan Smart. Eat Well.</span>
        </a>
        <button class="nav-toggle no-print" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="primary-navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="nav-menu" id="primary-navigation" aria-label="Primary navigation">
          <a class="nav-link" data-nav="index" href="mealmint-index.html">Home</a>
          <a class="nav-link" data-nav="goals" href="mealmint-goals.html">Goals</a>
          <a class="nav-link" data-nav="library" href="mealmint-library.html">Library</a>
          <a class="nav-link" data-nav="planner" href="mealmint-planner.html">Planner</a>
          <a class="nav-link" data-nav="dashboard" href="mealmint-dashboard.html">Dashboard</a>
          <a class="nav-link" data-nav="grocery" href="mealmint-grocery.html">Grocery</a>
        </nav>
        <div class="nav-actions" aria-label="MealMint status">
          <span class="nav-pill" data-goal-chip>Goal: --</span>
          <span class="nav-pill" data-kcal-chip>0 kcal</span>
          <span class="nav-avatar" aria-hidden="true"></span>
        </div>
      </div>
    </header>
    <main class="main">
      <section class="container">
        <div class="page-actions">
          <div class="page-heading compact" style="margin-bottom:0">
            <p class="eyebrow muted">Weekly Meal Planner</p>
            <h1>Weekly Meal Planner</h1>
            <p>Plan breakfast, lunch, dinner, and snacks for the upcoming week.</p>
          </div>
          <div class="tag-row no-print">
            <button class="btn btn-secondary" data-clear-plan>Clear All Plan</button>
            <a class="btn btn-primary" href="mealmint-library.html">Add From Library</a>
          </div>
        </div>
        <div class="planner-shell">
          <div class="planner-board" data-planner-board></div>
          <aside class="side-panel">
            <div class="summary-card card" data-planner-summary></div>
          </aside>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="container">
        <span>MealMint Health Labs</span>
        <span>Plan Smart. Eat Well.</span>
      </div>
    </footer>

  <script src="js/mealmint-app.js" defer></script>
  <script src="js/mealmint-planner.js" defer></script>
